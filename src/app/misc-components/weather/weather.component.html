<div class="weather-container">
    <h3>Weather - Chicago, IL</h3>

    <div *ngIf="loading" class="weather-loading">
      Loading 7-day forecast…
    </div>

    <div *ngIf="error" class="weather-error">
      <p>{{ error }}</p>
      <button (click)="retry()" mat-button>Retry</button>
    </div>

    <div *ngIf="!loading && !error && currentWeather" class="weather-cards">
        <div class="weather-card" *ngFor="let day of relativeDaysOfWeek; let i = index">
            <p class="day-names">{{day}}</p>
            <p class="temp">{{getMinMaxTemps(i)[0]}} °F</p>
            <span class="material-symbols-outlined weather-icon">
                {{ getWeatherIcon(i) }}
            </span>
            <p class="temp">{{getMinMaxTemps(i)[1]}} °F</p>
        </div>
    </div>
</div>
